name: Verify site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, launch-readiness-polish]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check production dependency security
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Quiz bank and scoring tests
        run: npm run test:quizzes

      - name: Build
        run: npm run build
